---
- name: Create Kong consumer and API key
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    kong_admin_url: "http://192.168.64.130:8001"
    kong_workspace: "default"
    consumer_username: "{{ customer_name }}"

    kong_headers:
      Kong-Workspace: "{{ kong_workspace }}"

  tasks:

    - name: Check Kong Admin API
      uri:
        url: "{{ kong_admin_url }}/status"
        method: GET
        status_code: 200
        headers: "{{ kong_headers }}"

    - name: Create consumer (idempotent)
      uri:
        url: "{{ kong_admin_url }}/consumers"
        method: POST
        status_code: [201, 409]
        body_format: json
        body:
          username: "{{ consumer_username }}"
        headers: "{{ kong_headers }}"

    - name: Check existing API keys
      uri:
        url: "{{ kong_admin_url }}/consumers/{{ consumer_username }}/key-auth"
        method: GET
        status_code: 200
        headers: "{{ kong_headers }}"
      register: existing_keys

    - name: Create API key if none exists
      uri:
        url: "{{ kong_admin_url }}/consumers/{{ consumer_username }}/key-auth"
        method: POST
        status_code: [201, 409]
        body_format: json
        headers: "{{ kong_headers }}"
      when:
        - existing_keys.json.data is defined
        - existing_keys.json.data | length == 0

    - name: Onboarding summary
      debug:
        msg: |
          Consumer '{{ consumer_username }}' onboarded successfully.
          Workspace: {{ kong_workspace }}
          API key status: {{ 'CREATED' if existing_keys.json.data | length == 0 else 'ALREADY EXISTS' }}
