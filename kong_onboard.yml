---
- name: Create Kong consumer and API key
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    kong_admin_url: "http://192.168.64.130:8001"
    kong_workspace: "default"
    consumer_username: "{{ customer_name }}"

    kong_headers:
      Kong-Workspace: "{{ kong_workspace }}"
      Content-Type: "application/json"

  tasks:

    - name: Check Kong Admin API
      uri:
        url: "{{ kong_admin_url }}/status"
        method: GET
        status_code: 200
        headers: "{{ kong_headers }}"

    - name: Create consumer (safe & idempotent)
      uri:
        url: "{{ kong_admin_url }}/consumers"
        method: POST
        status_code: [201, 409]
        body_format: json
        body:
          username: "{{ consumer_username }}"
        headers: "{{ kong_headers }}"

    - name: Create API key (WORKS for new & existing consumers)
      uri:
        url: "{{ kong_admin_url }}/consumers/{{ consumer_username }}/key-auth"
        method: POST
        status_code: [201, 409]
        body_format: json
        body: {}        # <-- THIS IS CRITICAL
        headers: "{{ kong_headers }}"
      register: key_result

    - name: Onboarding summary
      debug:
        msg: |
          Consumer: {{ consumer_username }}
          Workspace: {{ kong_workspace }}
          API Key: {{ 'CREATED' if key_result.status == 201 else 'ALREADY EXISTS' }}
