---
- name: Create Kong consumer and API key
  hosts: all
  gather_facts: false
  connection: local
  become: false

  vars:
    kong_admin_url: "http://{{ inventory_hostname }}:{{ kong_admin_port }}"
    consumer_username: "{{ consumer_name }}"

    kong_headers:
      Kong-Workspace: "{{ kong_workspace }}"
      Content-Type: application/json

  tasks:

    - name: Check Kong Admin API
      delegate_to: localhost
      uri:
        url: "{{ kong_admin_url }}/status"
        method: GET
        status_code: 200
        headers: "{{ kong_headers }}"
      register: status_check
      failed_when: status_check.status != 200

    - name: Create consumer
      delegate_to: localhost
      uri:
        url: "{{ kong_admin_url }}/consumers"
        method: POST
        status_code: [201, 409]
        body_format: json
        body:
          username: "{{ consumer_username }}"
        headers: "{{ kong_headers }}"
      register: consumer_result
      failed_when: consumer_result.status not in [201, 409]

    - name: Create API key
      delegate_to: localhost
      uri:
        url: "{{ kong_admin_url }}/consumers/{{ consumer_username }}/key-auth"
        method: POST
        status_code: [201, 409]
        body_format: json
        body: {}
        headers: "{{ kong_headers }}"
      register: key_result
      failed_when: key_result.status not in [201, 409]

    - name: ✅ Kong Consumer Onboarding Summary
      delegate_to: localhost
      debug:
        msg: |
          =========================================
          KONG CONSUMER ONBOARDING – RESULT
          =========================================
          Target Kong     : {{ inventory_hostname }}
          Environment     : {{ group_names | join(', ') }}
          Workspace       : {{ kong_workspace }}

          Consumer Name   : {{ consumer_username }}
          Consumer Result : {{
            'CREATED'
            if consumer_result.status == 201
            else 'ALREADY EXISTS'
          }}

          API Key Result  : {{
            'CREATED'
            if key_result.status == 201
            else 'ALREADY EXISTS'
          }}

          Status          : ✅ SUCCESS
          =========================================
