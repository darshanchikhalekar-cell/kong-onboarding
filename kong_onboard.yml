---
- name: Create Kong consumer and API key
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    kong_workspace: "{{ kong_workspace | default('default') }}"
    consumer_username: "{{ consumer_name }}"

  tasks:

    - name: Loop over selected Kong hosts
      vars:
        kong_admin_url: "http://{{ item }}:{{ hostvars[item].kong_admin_port }}"
      loop: "{{ ansible_play_batch }}"
      delegate_to: localhost
      block:

        - name: Check Kong Admin API
          uri:
            url: "{{ kong_admin_url }}/status"
            method: GET
            status_code: 200
            headers:
              Kong-Workspace: "{{ kong_workspace }}"
              Content-Type: application/json

        - name: Create consumer
          uri:
            url: "{{ kong_admin_url }}/consumers"
            method: POST
            status_code: [201, 409]
            body_format: json
            body:
              username: "{{ consumer_username }}"
            headers:
              Kong-Workspace: "{{ kong_workspace }}"
              Content-Type: application/json

        - name: Create API key
          uri:
            url: "{{ kong_admin_url }}/consumers/{{ consumer_username }}/key-auth"
            method: POST
            status_code: [201, 409]
            body_format: json
            body: {}
            headers:
              Kong-Workspace: "{{ kong_workspace }}"
              Content-Type: application/json
