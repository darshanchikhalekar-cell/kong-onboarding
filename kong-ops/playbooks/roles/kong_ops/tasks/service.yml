# -------------------------------
# Kong Service Operations (CLI)
# -------------------------------

- name: Start Kong
  shell: /usr/local/bin/kong start
  become: yes
  when: kong_action == 'kong_start'
  tags: kong_start

- name: Stop Kong
  shell: /usr/local/bin/kong stop
  become: yes
  when: kong_action == 'kong_stop'
  tags: kong_stop

- name: Restart Kong
  shell: /usr/local/bin/kong restart
  become: yes
  when: kong_action == 'kong_restart'
  tags: kong_restart
