- name: Start Kong (Docker)
  shell: docker start {{ kong_container_name }}
  when: kong_action == 'kong_start'

- name: Stop Kong (Docker)
  shell: docker stop {{ kong_container_name }}
  when: kong_action == 'kong_stop'

- name: Restart Kong (Docker)
  shell: docker restart {{ kong_container_name }}
  when: kong_action == 'kong_restart'
