# roles/kong_ops/tasks/service.yml

- name: Stop Kong
  shell: kong stop
  when: kong_action == 'kong_stop'
  tags: kong_stop

- name: Start Kong
  shell: kong start
  when: kong_action == 'kong_start'
  tags: kong_start

- name: Restart Kong
  shell: kong restart
  when: kong_action == 'kong_restart'
  tags: kong_restart
