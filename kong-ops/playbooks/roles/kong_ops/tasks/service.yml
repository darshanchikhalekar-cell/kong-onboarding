# -------------------------------
# Kong Service Operations (CLI)
# -------------------------------

- name: Start Kong
  shell: kong start
  become: yes
  when: kong_action == 'kong_start'
  tags:
    - kong_start

- name: Stop Kong
  shell: kong stop
  become: yes
  when: kong_action == 'kong_stop'
  tags:
    - kong_stop

- name: Restart Kong
  shell: kong restart
  become: yes
  when: kong_action == 'kong_restart'
  tags:
    - kong_restart
