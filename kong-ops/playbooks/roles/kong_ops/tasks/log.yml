# -------------------------------
# Kong Log Operations
# -------------------------------

- name: Ensure fetch directory exists
  file:
    path: "{{ fetch_dir }}"
    state: directory
    mode: '0755'
  tags: always

# -------- ERROR LOG --------
- name: Check if proxy error log exists
  stat:
    path: /usr/local/kong/logs/error.log
  register: kong_error_log
  become: yes
  no_log: true
  when: kong_action == 'error_logs'
  tags: error_logs

- name: Copy proxy error log to temp
  shell: cp /usr/local/kong/logs/error.log /tmp/kong_error.log
  become: yes
  when:
    - kong_action == 'error_logs'
    - kong_error_log.stat.exists
  tags: error_logs

- name: Fetch proxy error log
  fetch:
    src: /tmp/kong_error.log
    dest: "{{ fetch_dir }}/"
    flat: yes
  when:
    - kong_action == 'error_logs'
    - kong_error_log.stat.exists
  tags: error_logs

- name: Proxy error log not present
  debug:
    msg: "Kong error.log not present yet"
  when:
    - kong_action == 'error_logs'
    - not kong_error_log.stat.exists
  tags: error_logs

# -------- ACCESS LOG --------
- name: Check if proxy access log exists
  stat:
    path: /usr/local/kong/logs/access.log
  register: kong_access_log
  become: yes
  no_log: true
  when: kong_action == 'access_logs'
  tags: access_logs

- name: Copy proxy access log to temp
  shell: cp /usr/local/kong/logs/access.log /tmp/kong_access.log
  become: yes
  when:
    - kong_action == 'access_logs'
    - kong_access_log.stat.exists
  tags: access_logs

- name: Fetch proxy access log
  fetch:
    src: /tmp/kong_access.log
    dest: "{{ fetch_dir }}/"
    flat: yes
  when:
    - kong_action == 'access_logs'
    - kong_access_log.stat.exists
  tags: access_logs

- name: Proxy access log empty or no traffic
  debug:
    msg: "No proxy traffic yet — access.log empty"
  when:
    - kong_action == 'access_logs'
    - not kong_access_log.stat.exists
  tags: access_logs
