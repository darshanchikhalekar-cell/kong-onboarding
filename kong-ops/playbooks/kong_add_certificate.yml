---
- name: Kong – Add TLS Certificate
  hosts: all
  gather_facts: false
  connection: local
  become: false

  vars:
    kong_admin_url: "http://{{ inventory_hostname }}:{{ kong_admin_port }}"
    deploy_path: "/tmp/kong_tls_{{ awx_job_id }}"

  tasks:

    # ============================================================
    # WHO EXECUTED THIS JOB
    # ============================================================
    - name: Capture execution context
      delegate_to: localhost
      set_fact:
        executed_by: "{{ awx_user_name | default('awx') }}"

    # ============================================================
    # VALIDATE SURVEY INPUTS
    # ============================================================
    - name: Validate TLS inputs from survey
      delegate_to: localhost
      fail:
        msg: "TLS Certificate or Private Key is missing in survey input"
      when:
        - tls_certificate is not defined or tls_certificate | length == 0
        - tls_private_key is not defined or tls_private_key | length == 0

    # ============================================================
    # CREATE TEMP DIRECTORY
    # ============================================================
    - name: Create temp directory
      delegate_to: localhost
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    # ============================================================
    # CREATE CERTIFICATE FILES
    # ============================================================
    - name: Create TLS certificate file
      delegate_to: localhost
      copy:
        content: "{{ tls_certificate }}"
        dest: "{{ deploy_path }}/tls.crt"
        mode: '0644'

    - name: Create TLS private key file
      delegate_to: localhost
      copy:
        content: "{{ tls_private_key }}"
        dest: "{{ deploy_path }}/tls.key"
        mode: '0600'

    # ============================================================
    # ADD TLS CERTIFICATE TO KONG
    # ============================================================
    - name: Upload TLS certificate to Kong
      delegate_to: localhost
      command: >
        curl -s -X POST
        {{ kong_admin_url }}/certificates
        -F "cert=@{{ deploy_path }}/tls.crt"
        -F "key=@{{ deploy_path }}/tls.key"
      register: cert_add_output
      failed_when: cert_add_output.stdout is not search('"id"')

    # ============================================================
    # EXTRACT CERTIFICATE UUID
    # ============================================================
    - name: Extract certificate UUID
      delegate_to: localhost
      set_fact:
        certificate_uuid: "{{ (cert_add_output.stdout | from_json).id }}"

    # ============================================================
    # FINAL SUMMARY (OPERATOR FRIENDLY)
    # ============================================================
    - name: ✅ TLS Certificate Deployment Summary
      delegate_to: localhost
      debug:
        msg: |
          =========================================
          KONG TLS CERTIFICATE DEPLOYMENT – RESULT
          =========================================
          Target Kong     : {{ inventory_hostname }}
          Environment     : {{ group_names | join(', ') }}
          Kong Admin URL  : {{ kong_admin_url }}

          Certificate ID  : {{ certificate_uuid }}
          Executed By     : {{ executed_by }}

          Status          : ✅ SUCCESS
          =========================================

    # ============================================================
    # CLEANUP
    # ============================================================
    - name: Cleanup temp directory
      delegate_to: localhost
      file:
        path: "{{ deploy_path }}"
        state: absent
