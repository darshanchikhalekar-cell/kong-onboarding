---
- name: Kong | TLS Certificate Deployment
  hosts: all
  gather_facts: false
  connection: local
  become: false

  vars:
    kong_admin_url: "http://{{ inventory_hostname }}:{{ kong_admin_port }}"
    deploy_path: "/tmp/kong_tls_{{ awx_job_id }}"

  tasks:

    # ============================================================
    # EXECUTION CONTEXT (AWX USER)
    # ============================================================
    - name: Capture execution user
      delegate_to: localhost
      set_fact:
        executed_by: "{{ awx_user_name | default('awx') }}"

    # ============================================================
    # VALIDATE SURVEY INPUTS
    # ============================================================
    - name: Validate TLS survey inputs
      delegate_to: localhost
      fail:
        msg: "TLS Certificate Name, Certificate, or Private Key missing"
      when:
        - tls_cert_name is not defined or tls_cert_name | length == 0
        - tls_certificate is not defined or tls_certificate | length == 0
        - tls_private_key is not defined or tls_private_key | length == 0

    # ============================================================
    # PREPARE FILES
    # ============================================================
    - name: Create temporary directory
      delegate_to: localhost
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    - name: Write TLS certificate
      delegate_to: localhost
      copy:
        content: "{{ tls_certificate }}"
        dest: "{{ deploy_path }}/tls.crt"
        mode: '0644'

    - name: Write TLS private key
      delegate_to: localhost
      copy:
        content: "{{ tls_private_key }}"
        dest: "{{ deploy_path }}/tls.key"
        mode: '0600'

    # ============================================================
    # ADD CERTIFICATE TO KONG (API CALL)
    # ============================================================
    - name: Upload TLS certificate to Kong
      delegate_to: localhost
      command: >
        curl -s -X POST {{ kong_admin_url }}/certificates
        -F "cert=@{{ deploy_path }}/tls.crt"
        -F "key=@{{ deploy_path }}/tls.key"
        -F "tags={{ tls_cert_name }}"
      register: cert_add_output
      failed_when: cert_add_output.stdout is not search('"id"')
      changed_when: true

    # ============================================================
    # EXTRACT CERTIFICATE ID
    # ============================================================
    - name: Extract certificate UUID
      delegate_to: localhost
      set_fact:
        certificate_uuid: "{{ (cert_add_output.stdout | from_json).id }}"

    # ============================================================
    # SUCCESS SUMMARY
    # ============================================================
    - name: ✅ TLS Certificate Deployment Summary
      delegate_to: localhost
      debug:
        msg: |
          ┌─────────────────────────────────────────────┐
          │        KONG TLS CERTIFICATE DEPLOYMENT       │
          └─────────────────────────────────────────────┘

          ▶ Target Details
            • Kong Node        : {{ inventory_hostname }}
            • Environment(s)   : {{ group_names | join(', ') }}
            • Admin API URL    : {{ kong_admin_url }}

          ▶ Certificate Details
            • Certificate Name : {{ tls_cert_name }}
            • Certificate ID   : {{ certificate_uuid }}

          ▶ Execution Details
            • Executed By      : {{ executed_by }}
            • AWX Job ID       : {{ awx_job_id }}

          ▶ Status
            • Result           : ✅ SUCCESS

          ───────────────────────────────────────────────

    # ============================================================
    # CLEANUP
    # ============================================================
    - name: Cleanup temporary files
      delegate_to: localhost
      file:
        path: "{{ deploy_path }}"
        state: absent
