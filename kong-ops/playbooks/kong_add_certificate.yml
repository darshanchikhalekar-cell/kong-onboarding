---
- name: Kong | TLS Certificate Deployment
  hosts: all
  gather_facts: false
  connection: local

  vars:
    kong_admin_url: "http://{{ inventory_hostname }}:8001"
    deploy_path: "/tmp/kong_tls_{{ awx_job_id | default('manual') }}"

  tasks:

    - block:

        # ============================================================
        # IDENTIFY EXECUTION USER
        # ============================================================
        - name: Capture execution user
          delegate_to: localhost
          command: whoami
          register: cert_added_by
          changed_when: false

        # ============================================================
        # VALIDATE SURVEY INPUTS
        # ============================================================
        - name: Validate TLS survey inputs
          delegate_to: localhost
          fail:
            msg: "Certificate Name, Certificate PEM, or Private Key PEM is missing"
          when:
            - tls_cert_name is not defined or tls_cert_name | length == 0
              or tls_certificate is not defined or tls_certificate | length == 0
              or tls_private_key is not defined or tls_private_key | length == 0

        # ============================================================
        # CREATE TEMP DIRECTORY
        # ============================================================
        - name: Create temporary directory
          delegate_to: localhost
          file:
            path: "{{ deploy_path }}"
            state: directory
            mode: '0755'

        # ============================================================
        # WRITE CERTIFICATE FILES
        # ============================================================
        - name: Write TLS certificate
          delegate_to: localhost
          copy:
            content: "{{ tls_certificate }}"
            dest: "{{ deploy_path }}/tls.crt"
            mode: '0644'

        - name: Write TLS private key
          delegate_to: localhost
          copy:
            content: "{{ tls_private_key }}"
            dest: "{{ deploy_path }}/tls.key"
            mode: '0600'

        # ============================================================
        # UPLOAD CERTIFICATE TO KONG
        # ============================================================
        - name: Upload TLS certificate to Kong
          delegate_to: localhost
          uri:
            url: "{{ kong_admin_url }}/certificates"
            method: POST
            body_format: form-multipart
            body:
              cert: "@{{ deploy_path }}/tls.crt"
              key: "@{{ deploy_path }}/tls.key"
              tags: "{{ tls_cert_name }}"
            status_code: [201, 409]
          register: cert_add_output

        # ============================================================
        # EXTRACT CERTIFICATE UUID
        # ============================================================
        - name: Extract certificate UUID
          delegate_to: localhost
          set_fact:
            certificate_uuid: "{{ cert_add_output.json.id | default('ALREADY_EXISTS') }}"

        # ============================================================
        # SUCCESS SUMMARY
        # ============================================================
        - name: ✅ TLS Certificate Deployment Summary
          delegate_to: localhost
          debug:
            msg: |
              ========================================
              KONG TLS CERTIFICATE DEPLOYMENT – RESULT
              ========================================

              Target Details
              --------------
              Kong Node        : {{ inventory_hostname }}
              Environment(s)  : {{ group_names | join(', ') }}
              Admin API URL   : {{ kong_admin_url }}

              Certificate Details
              -------------------
              Certificate Name: {{ tls_cert_name }}
              Certificate ID  : {{ certificate_uuid }}

              Execution Details
              -----------------
              Executed By     : {{ cert_added_by.stdout }}
              AWX Job ID      : {{ awx_job_id | default('N/A') }}

              Status
              ------
              Result          : ✅ SUCCESS
              ========================================

        # ============================================================
        # CLEANUP
        # ============================================================
        - name: Cleanup temporary files
          delegate_to: localhost
          file:
            path: "{{ deploy_path }}"
            state: absent

      rescue:

        - name: ❌ TLS Certificate Deployment Failed
          delegate_to: localhost
          debug:
            msg: |
              ========================================
              KONG TLS CERTIFICATE DEPLOYMENT – FAILED
              ========================================

              Target Kong : {{ inventory_hostname }}
              Admin URL   : {{ kong_admin_url }}

              Reason
              ------
              {{ ansible_failed_result.msg | default('Unknown error') }}

              Action
              ------
              Verify certificate format and Kong Admin API availability.
              ========================================
