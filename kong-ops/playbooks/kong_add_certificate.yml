---
- name: Kong | Add TLS Certificate
  hosts: all
  gather_facts: false
  connection: local

  vars:
    kong_admin_url: "http://{{ inventory_hostname }}:8001"
    deploy_path: "/tmp/kong_tls_{{ awx_job_id }}"

  tasks:

    # ============================================================
    # CAPTURE WHO DEPLOYED (AWX SAFE)
    # ============================================================
    - name: Capture execution user
      set_fact:
        deployed_by: "{{ awx_user_name | default('unknown') }}"

    # ============================================================
    # VALIDATE SURVEY INPUTS
    # ============================================================
    - name: Validate TLS survey inputs
      fail:
        msg: "Certificate PEM or Private Key PEM missing"
      when:
        - tls_certificate | default('') | length == 0
        - tls_private_key | default('') | length == 0

    # ============================================================
    # CREATE TEMP DIRECTORY
    # ============================================================
    - name: Create temporary directory
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    # ============================================================
    # WRITE CERT FILES
    # ============================================================
    - name: Write TLS certificate
      copy:
        content: "{{ tls_certificate }}"
        dest: "{{ deploy_path }}/tls.crt"
        mode: '0644'

    - name: Write TLS private key
      copy:
        content: "{{ tls_private_key }}"
        dest: "{{ deploy_path }}/tls.key"
        mode: '0600'

    # ============================================================
    # UPLOAD CERTIFICATE TO KONG
    # ============================================================
    - name: Upload TLS certificate to Kong
      command: >
        curl -s -X POST
        {{ kong_admin_url }}/certificates
        -F "cert=@{{ deploy_path }}/tls.crt"
        -F "key=@{{ deploy_path }}/tls.key"
      register: cert_add_output
      changed_when: "'id' in cert_add_output.stdout"

    # ============================================================
    # EXTRACT CERTIFICATE ID
    # ============================================================
    - name: Extract certificate ID
      set_fact:
        certificate_id: "{{ (cert_add_output.stdout | from_json).id }}"

    # ============================================================
    # FINAL USER DISPLAY (CLEAN)
    # ============================================================
    - name: TLS Certificate Deployment Result
      debug:
        msg: |
          =========================================
          KONG TLS CERTIFICATE DEPLOYED
          =========================================
          Target Kong   : {{ inventory_hostname }}
          Certificate ID: {{ certificate_id }}
          Deployed By   : {{ deployed_by }}
          =========================================

    # ============================================================
    # CLEANUP
    # ============================================================
    - name: Cleanup temporary files
      file:
        path: "{{ deploy_path }}"
        state: absent
