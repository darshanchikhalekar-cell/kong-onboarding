---
- name: Kong – Add TLS Certificate
  hosts: all
  gather_facts: false

  vars:
    kong_admin_url: "http://127.0.0.1:8001"
    deploy_path: "/tmp/kong_tls_{{ awx_job_id }}"

  tasks:

    # ============================================================
    # WHO ADDED THE CERTIFICATE
    # ============================================================
    - name: Get execution user
      command: whoami
      register: cert_added_by
      changed_when: false

    # ============================================================
    # VALIDATE SURVEY INPUTS
    # ============================================================
    - name: Validate TLS inputs from survey
      fail:
        msg: "TLS Certificate or Private Key not provided in survey"
      when:
        - tls_certificate is not defined
        - tls_private_key is not defined

    # ============================================================
    # CREATE TEMP DIRECTORY
    # ============================================================
    - name: Create temp directory
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    # ============================================================
    # CREATE CERTIFICATE FILES
    # ============================================================
    - name: Create TLS certificate file
      copy:
        content: "{{ tls_certificate }}"
        dest: "{{ deploy_path }}/tls.crt"
        mode: '0644'

    - name: Create TLS private key file
      copy:
        content: "{{ tls_private_key }}"
        dest: "{{ deploy_path }}/tls.key"
        mode: '0600'

    # ============================================================
    # ADD TLS CERTIFICATE TO KONG
    # ============================================================
    - name: Add TLS certificate to Kong
      command: >
        curl -s -X POST
        {{ kong_admin_url }}/certificates
        -F "cert=@{{ deploy_path }}/tls.crt"
        -F "key=@{{ deploy_path }}/tls.key"
      register: cert_add_output
      changed_when: "'id' in cert_add_output.stdout"

    - name: TLS certificate status
      debug:
        msg: "TLS certificate added successfully"

    # ============================================================
    # EXTRACT CERTIFICATE UUID (NO json_query)
    # ============================================================
    - name: Extract certificate UUID
      set_fact:
        certificate_uuid: "{{ (cert_add_output.stdout | from_json).id }}"

    # ============================================================
    # FINAL RESULT
    # ============================================================
    - name: Print certificate result
      debug:
        msg:
          - "Certificate UUID: {{ certificate_uuid }}"
          - "Certificate added by user: {{ cert_added_by.stdout }}"

    # ============================================================
    # CLEANUP
    # ============================================================
    - name: Delete temp directory
      file:
        path: "{{ deploy_path }}"
        state: absent

    - name: Post deployment cleanup
      debug:
        msg: "Successful post deployment cleanup from {{ deploy_path }}"
