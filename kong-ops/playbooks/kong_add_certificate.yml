---
- name: Kong – Add TLS Certificate
  hosts: all
  gather_facts: false
  connection: local
  become: false

  vars:
    kong_admin_url: "http://{{ inventory_hostname }}:{{ kong_admin_port }}"
    deploy_path: "/tmp/kong_tls_{{ awx_job_id }}"

  tasks:

    # ============================================================
    # VALIDATE SURVEY INPUTS
    # ============================================================
    - name: Validate TLS inputs
      delegate_to: localhost
      fail:
        msg: "Certificate Name, Certificate PEM, or Private Key PEM missing"
      when:
        - certificate_name is not defined or certificate_name | length == 0
        - tls_certificate is not defined or tls_certificate | length == 0
        - tls_private_key is not defined or tls_private_key | length == 0

    # ============================================================
    # CREATE TEMP DIRECTORY
    # ============================================================
    - name: Create temp directory
      delegate_to: localhost
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    # ============================================================
    # WRITE CERT FILES
    # ============================================================
    - name: Write certificate PEM
      delegate_to: localhost
      copy:
        content: "{{ tls_certificate }}"
        dest: "{{ deploy_path }}/tls.crt"
        mode: '0644'

    - name: Write private key PEM
      delegate_to: localhost
      copy:
        content: "{{ tls_private_key }}"
        dest: "{{ deploy_path }}/tls.key"
        mode: '0600'

    # ============================================================
    # UPLOAD CERTIFICATE TO KONG
    # ============================================================
    - name: Upload TLS certificate to Kong
      delegate_to: localhost
      command: >
        curl -s -X POST
        {{ kong_admin_url }}/certificates
        -F "cert=@{{ deploy_path }}/tls.crt"
        -F "key=@{{ deploy_path }}/tls.key"
        -F "tags={{ certificate_name }}"
      register: cert_add_output
      failed_when: cert_add_output.stdout is not search('"id"')

    # ============================================================
    # EXTRACT CERT UUID
    # ============================================================
    - name: Extract certificate UUID
      delegate_to: localhost
      set_fact:
        certificate_uuid: "{{ (cert_add_output.stdout | from_json).id }}"

    # ============================================================
    # FINAL OUTPUT (AWX FRIENDLY)
    # ============================================================
    - name: ✅ TLS Certificate Deployment Result
      delegate_to: localhost
      debug:
        msg: |
          =========================================
          KONG TLS CERTIFICATE DEPLOYMENT
          =========================================
          Target Kong     : {{ inventory_hostname }}
          Environment     : {{ group_names | join(', ') }}

          Certificate Name: {{ certificate_name }}
          Certificate ID  : {{ certificate_uuid }}

          Status          : ✅ SUCCESS
          =========================================

    # ============================================================
    # CLEANUP
    # ============================================================
    - name: Cleanup temp files
      delegate_to: localhost
      file:
        path: "{{ deploy_path }}"
        state: absent
